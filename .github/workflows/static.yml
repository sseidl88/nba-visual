name: Daily WNBA Stats

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run WNBA stats script
        run: python "nba notification.py" --league wnba

      - name: Run NBA stats script
        run: python "nba notification.py" --league nba

      - name: Run NCAA Men's stats script
        run: python "nba notification.py" --league ncaam

      - name: Run NCAA Women's stats script
        run: python "nba notification.py" --league ncaaw

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ docs/data/nba/ docs/data/ncaam/ docs/data/ncaaw/ docs/index.html docs/style.css
          git diff --staged --quiet && echo "No new data" && exit 0
          git commit -m "Update daily stats $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
